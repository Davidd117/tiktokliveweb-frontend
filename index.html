<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Pixel Board</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(50, 10px);
      grid-template-rows: repeat(50, 10px);
      gap: 1px;
      margin-top: 20px;
    }

    .pixel {
      width: 10px;
      height: 10px;
      background: #222;
      cursor: pointer;
    }

    #controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button, input {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }

    button {
      background: #4CAF50;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    #info {
      margin-top: 10px;
    }

    #color {
      width: 80px;
      height: 35px;
      padding: 0;
      border: none;
    }
  </style>
</head>
<body>
  <h1>🎨 Live Pixel Board</h1>

  <div id="controls">
    <button id="getCodeBtn">Get Code</button>
    <input type="text" id="returnToken" placeholder="Return Token" />
    <button id="verifyBtn">Verify</button>
    <input type="color" id="color" value="#ff0000" />
  </div>

  <div id="info"></div>
  <div id="grid"></div>

  <script>
    const socket = new WebSocket(`wss://${window.location.host}`);
    const gridEl = document.getElementById("grid");
    const infoEl = document.getElementById("info");
    const getCodeBtn = document.getElementById("getCodeBtn");
    const verifyBtn = document.getElementById("verifyBtn");
    const returnTokenEl = document.getElementById("returnToken");
    const colorPicker = document.getElementById("color");

    let sessionId = null;
    let verified = false;
    let pixelsLeft = 0;
    let nextPixelTime = 0;

    // Build grid
    const pixelCount = 50 * 50;
    for (let i = 0; i < pixelCount; i++) {
      const div = document.createElement("div");
      div.className = "pixel";
      div.dataset.index = i;
      div.addEventListener("click", () => placePixel(i));
      gridEl.appendChild(div);
    }

    function updateInfo(msg) {
      infoEl.textContent = msg;
    }

    function updatePixel(idx, color) {
      const pixelEl = gridEl.children[idx];
      pixelEl.style.background = color;
    }

    // SOCKET
    socket.addEventListener("open", () => {
      console.log("Connected to server");
    });

    socket.addEventListener("message", (event) => {
      const data = JSON.parse(event.data);

      if (data.type === "info") {
        updateInfo(data.message);
        if (data.pixels_left !== undefined) pixelsLeft = data.pixels_left;
        if (data.next_pixel_time !== undefined) nextPixelTime = data.next_pixel_time;
      }

      if (data.type === "token") {
        alert(`Your code: ${data.token}\n\nEnter this code in the TikTok LIVE chat.`);
      }

      if (data.type === "verified") {
        verified = true;
        sessionId = data.session;
        pixelsLeft = data.pixels_left;
        nextPixelTime = data.next_pixel_time;
        updateInfo(`✅ Verified as @${data.username} — Pixels left: ${pixelsLeft}`);
      }

      if (data.type === "verify_failed") {
        alert("❌ You have not followed the creator. Please follow and enter the code again.");
      }

      if (data.type === "pixel") {
        updatePixel(data.index, data.color);
      }

      if (data.type === "init_pixels") {
        for (const [idx, pix] of Object.entries(data.pixels)) {
          updatePixel(idx, pix.color);
        }
      }
    });

    // GET CODE
    getCodeBtn.addEventListener("click", () => {
      socket.send(JSON.stringify({ action: "get_token", session: sessionId }));
    });

    // VERIFY
    verifyBtn.addEventListener("click", () => {
      const token = returnTokenEl.value.trim();
      if (!token) return;
      socket.send(JSON.stringify({
        action: "verify",
        session: sessionId,
        username: null,
        token: token
      }));
    });

    // PLACE PIXEL
    function placePixel(index) {
      if (!verified) {
        updateInfo("⚠️ You must be verified first.");
        return;
      }

      if (pixelsLeft <= 0) {
        updateInfo("⏳ No pixels left. Wait for cooldown.");
        return;
      }

      const color = colorPicker.value;
      socket.send(JSON.stringify({
        action: "place_pixel",
        index,
        color,
        session: sessionId
      }));

      pixelsLeft--;
      updateInfo(`✅ Pixel placed — Remaining: ${pixelsLeft}`);
    }
  </script>
</body>
</html>
