<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pixel Canvas</title>
<style>
  body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  #canvas {
    margin-top: 20px;
    border: 2px solid white;
    background: #222;
  }
  #cooldown {
    margin-top: 15px;
    font-size: 18px;
  }
</style>
</head>
<body>
  <h1>🎨 Collaborative Pixel Canvas</h1>
  <canvas id="canvas" width="500" height="500"></canvas>
  <div id="cooldown">Cooldown: 0s</div>
  <script>
    const COOLDOWN = 30; // must match backend
    const userId = "user_" + Math.floor(Math.random() * 100000);
    const ws = new WebSocket("ws://localhost:8765");

    let pixelsLeft = 1;
    let nextPixelTime = 0;

    const cooldownEl = document.getElementById("cooldown");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: "verify", user_id: userId }));
    };

    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "user_update") {
        pixelsLeft = msg.pixels_left ?? pixelsLeft;
        if (msg.next_pixel_time) {
          nextPixelTime = msg.next_pixel_time; // sync with backend timer
        }
      }

      if (msg.type === "canvas_update") {
        const x = msg.x ?? Math.floor(Math.random() * 50);
        const y = msg.y ?? Math.floor(Math.random() * 50);
        ctx.fillStyle = "lime";
        ctx.fillRect(x * 10, y * 10, 10, 10);
      }
    };

    // Countdown display
    setInterval(() => {
      const now = Date.now() / 1000;
      const remaining = Math.max(0, Math.ceil(nextPixelTime - now));

      if (remaining > 0) {
        cooldownEl.textContent = `⏳ Cooldown: ${remaining}s`;
      } else {
        cooldownEl.textContent = `✅ Pixel Ready (${pixelsLeft} available)`;
      }
    }, 500);

    // Place pixel on click
    canvas.addEventListener("click", () => {
      const now = Date.now() / 1000;

      if (now < nextPixelTime) {
        alert(`Please wait ${Math.ceil(nextPixelTime - now)} seconds.`);
        return;
      }

      if (pixelsLeft <= 0) {
        alert("No pixels left right now!");
        return;
      }

      const x = Math.floor(Math.random() * 50);
      const y = Math.floor(Math.random() * 50);

      ws.send(JSON.stringify({
        type: "place_pixel",
        user_id: userId,
        x: x,
        y: y
      }));

      pixelsLeft--;
      nextPixelTime = now + COOLDOWN; // set local cooldown fallback
    });
  </script>
</body>
</html>
